<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>翻译设置 · OpenTransAI</title>
  <link rel="icon" href="icons/ai-translate-light.svg" type="image/svg+xml">
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup-page">
  <div id="translator-settings">
  <main class="settings" aria-label="翻译插件配置">
    <header class="heading">
      <img class="mark" src="icons/ai-translate-light.svg" width="52" height="52" alt="">
      <div><h1>翻译设置</h1><p>连接你的 AI 翻译服务</p></div>
      <a class="diagnostics-link" href="diagnostics.html" target="_blank" rel="noopener">诊断日志</a>
    </header>
    <div class="toggle-row"><label for="enabled">翻译功能</label><input id="enabled" type="checkbox" class="toggle" role="switch" disabled></div>
    <form id="settings-form">
      <fieldset id="fields" disabled>
        <div class="field">
          <label for="provider">协议类型</label>
          <div class="select-wrap"><select id="provider" name="provider">
            <option value="openai">OpenAI 兼容</option><option value="anthropic">Anthropic</option><option value="gemini">Google Gemini</option>
          </select></div>
        </div>
        <div class="field">
          <label for="base-url">API 地址</label>
          <input id="base-url" name="baseUrl" type="url" placeholder="https://api.example.com/v1" required autocomplete="off" spellcheck="false" maxlength="2048">
        </div>
        <div class="field">
          <label for="model">模型</label>
          <input id="model" name="model" placeholder="填写 API 服务商提供的模型 ID" required autocomplete="off" spellcheck="false" maxlength="200">
          <p class="field-hint">图片发送至此 API，由当前模型识别（需支持视觉）。连接测试仅验证文本翻译。</p>
        </div>
        <div class="field">
          <label for="api-key">API Key</label>
          <div class="secret"><input id="api-key" name="apiKey" type="password" placeholder="输入 API Key" required autocomplete="off" spellcheck="false" maxlength="2000"><button id="reveal" class="reveal" type="button" aria-controls="api-key" aria-pressed="false">显示</button></div>
        </div>
        <div class="field">
          <div class="language-label-row"><label for="default-language">默认语言</label><span id="language-hint">默认翻译为此语言</span></div>
          <div class="select-wrap"><select id="default-language" name="defaultLanguage" aria-describedby="language-hint"></select></div>
        </div>
        <div class="actions"><button id="test" class="secondary" type="button">测试连接</button><button id="save" class="save" type="submit">保存配置</button></div>
      </fieldset>
      <div class="feedback"><div class="feedback-copy"><p id="notice" class="notice" role="status" aria-live="polite"></p><div id="draft-state" hidden><span id="draft-notice" role="status"></span></div></div><button id="discard-draft" type="button" hidden>放弃修改</button></div>
    </form>
  </main>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
